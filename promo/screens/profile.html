.acts{display:flex;align-items:center;gap:34px;margin-top:22px;color:#5a5a63;font:500 21px Montserrat}
.acts svg{width:29px;height:29px;stroke:currentColor;fill:none;stroke-width:1.9;vertical-align:-6px;margin-right:9px}
