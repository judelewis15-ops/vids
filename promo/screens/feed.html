<style>
.screen{background:#FAF8F4}
.sb{height:96px;flex:0 0 96px;display:flex;align-items:center;justify-content:space-between;padding:0 46px;font:600 21px Montserrat;color:#111}
.bars{display:flex;align-items:flex-end;gap:3px;height:17px}
.bars i{width:4px;background:#111;border-radius:1px}
.batt{width:29px;height:15px;border:2px solid #111;border-radius:4px;position:relative}
.batt:after{content:"";position:absolute;inset:2px;background:#111;border-radius:1px}
.r{display:flex;align-items:center;gap:9px}
.hd{display:flex;align-items:center;justify-content:space-between;padding:6px 34px 22px}
.hd svg{width:34px;height:34px;stroke:#111;fill:none;stroke-width:2}
.hd b{font:700 27px Montserrat;color:#111}
.mail{position:relative}
.mail .dot{position:absolute;top:-6px;right:-8px;width:26px;height:26px;border-radius:50%;background:#7B3FF2;color:#fff;font:700 14px Montserrat;display:flex;align-items:center;justify-content:center}
.chips{display:flex;gap:14px;padding:0 34px 26px;overflow:hidden}
.chips div{padding:16px 30px;border-radius:999px;border:1.6px solid #e0dbd2;font:600 20px Montserrat;color:#111;white-space:nowrap}
.chips div.on{background:#7B3FF2;border-color:#7B3FF2;color:#fff}
.body{flex:1;padding:0 34px;overflow:hidden}
.post{border-top:1.6px solid #ece7de;padding:28px 0}
.ph{display:flex;align-items:center;gap:14px}
.pav{width:52px;height:52px;border-radius:50%;background:#cfc7bb}
.pav.p{background:linear-gradient(160deg,#9163f5,#7B3FF2)}
.ph b{font:700 20px Montserrat;color:#7B3FF2}
.ph i{font:500 19px Montserrat;color:#8b8b93;font-style:normal}
.ttl{font:700 25px Montserrat;color:#111;margin:16px 0 18px}
.pimg{height:300px;border-radius:20px;position:relative;overflow:hidden;
 background:linear-gradient(165deg,#6b5a48,#3b2f24 55%,#241c15)}
.pimg .cap{position:absolute;left:16px;bottom:14px;right:16px;color:#fff;font:500 17px Montserrat;opacity:.9}
.acts{display:flex;align-items:center;gap:40px;margin-top:20px;color:#5a5a63;font:500 20px Montserrat}
.acts svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:1.9;vertical-align:-6px;margin-right:8px}
.acts .lk{color:#7B3FF2}
.acts .lk svg{fill:#7B3FF2;stroke:#7B3FF2}
</style>
