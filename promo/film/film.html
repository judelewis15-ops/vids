<link rel="stylesheet" href="../screens/g.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#07070A}
#stage{width:1080px;height:1920px;position:relative;overflow:hidden;
 background:radial-gradient(64% 42% at 50% 34%, #241748 0%, #140E2A 38%, #0A0714 68%, #07070A 100%)}
#glow{position:absolute;left:50%;top:30%;width:1500px;height:1500px;transform:translate(-50%,-50%);
 background:radial-gradient(circle, rgba(123,63,242,.30) 0%, rgba(123,63,242,.10) 38%, transparent 66%);filter:blur(20px)}
#vig{position:absolute;inset:0;background:radial-gradient(78% 62% at 50% 42%, transparent 44%, rgba(0,0,0,.62) 100%)}
#wrap{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);perspective:2400px}
#dev{position:relative;width:620px;height:1348px;border-radius:74px;transform-style:preserve-3d;
 background:linear-gradient(150deg,#4a4a52 0%,#17171c 18%,#0d0d11 50%,#1c1c22 82%,#3e3e46 100%);
 padding:10px;box-shadow:0 70px 130px rgba(0,0,0,.72), 0 0 90px rgba(123,63,242,.16)}
#scr{position:relative;width:100%;height:100%;border-radius:65px;overflow:hidden;background:#000}
#scr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}
#sheen{position:absolute;inset:10px;border-radius:65px;pointer-events:none;
 background:linear-gradient(118deg,rgba(255,255,255,.20) 0%,rgba(255,255,255,.05) 16%,transparent 34%,transparent 72%,rgba(255,255,255,.07) 100%)}
#cap{position:absolute;left:110px;right:110px;top:1608px;text-align:center;
 font:600 46px/1.34 Montserrat,sans-serif;color:#fff;letter-spacing:-.4px;opacity:0}
#end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:52px;opacity:0}
#end img{width:520px;filter:invert(1) brightness(2)}
#end p{font:600 46px/1.34 Montserrat,sans-serif;color:#fff;text-align:center;max-width:760px;letter-spacing:-.3px}
</style>
<div id="stage">
 <div id="glow"></div>
 <div id="wrap"><div id="dev"><div id="scr">
   <img id="s0" src="../screens/courses-bare.png">
   <img id="s1" src="../screens/profile-bare.png">
   <img id="s2" src="../screens/feed-bare.png">
 </div><div id="sheen"></div></div></div>
 <div id="vig"></div>
 <div id="cap"></div>
 <div id="end"><img src="logo.png"><p>Free grow kit for the first 500 on annual. Grows 1kg.</p></div>
</div>
<script>
const CAPS=["Cultivation courses. Beginner to expert.",
            "Expert cultivators. Available 24/7.",
            "A feed for questions and community."];
const BEAT=3, DUR=12;
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
// ramp up over `ins`, hold, ramp down over `outs`
function env(t,start,len,ins,outs){
  if(t<start||t>start+len) return 0;
  const l=t-start, r=start+len-t;
  return cl(Math.min(l/ins, r/outs),0,1);
}
window.setTime=function(t){
  const beat=Math.min(3,Math.floor(t/BEAT));
  // screens crossfade
  for(let i=0;i<3;i++){
    const el=document.getElementById('s'+i);
    let o=0;
    if(beat<3){
      const local=t-i*BEAT;
      o=cl(local/0.5,0,1)*cl((( i*BEAT+BEAT+0.35)-t)/0.5,0,1);
      if(i!==beat && !(i===beat-1)) o=Math.min(o,0);
    }
    el.style.opacity=o.toFixed(3);
  }
  // device motion: slow push in plus a gentle turn and float
  const p=cl(t/9,0,1);
  const s=0.95+0.08*ease(p);
  const ry=-7+14*ease(p);
  const fy=Math.sin(t*0.85)*9;
  const out=t>9?cl((t-9)/0.7,0,1):0;
  const dev=document.getElementById('dev');
  dev.style.transform=`translateY(${fy - out*120}px) scale(${s*(1-out*0.10)}) rotateY(${ry}deg) rotateX(${1.5-out*3}deg)`;
  document.getElementById('wrap').style.opacity=(1-out).toFixed(3);
  // caption
  const cap=document.getElementById('cap');
  if(beat<3){
    cap.textContent=CAPS[beat];
    const o=env(t,beat*BEAT+0.25,BEAT-0.45,0.4,0.4);
    cap.style.opacity=o.toFixed(3);
    cap.style.transform=`translateY(${(1-o)*26}px)`;
  } else cap.style.opacity=0;
  // end card
  const e=document.getElementById('end');
  const eo=t>9.35?cl((t-9.35)/0.6,0,1):0;
  e.style.opacity=eo.toFixed(3);
  e.style.transform=`scale(${0.965+0.035*eo})`;
};
setTime(0);
</script>
