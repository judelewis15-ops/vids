<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Origin Map</title>
    <meta
      name="description"
      content="An interactive world map of origins. Tap a pin to read its story."
    />
    <meta name="theme-color" content="#1A0B2E" />
    <meta name="color-scheme" content="dark" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="preconnect" href="https://a.basemaps.cartocdn.com" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%237C3AED' stroke='%23FAF7F2' stroke-width='3'/%3E%3C/svg%3E"
    />

    <!-- Fonts load without blocking first paint; display=swap keeps text visible meanwhile. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript
      ><link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap"
    /></noscript>
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preload" href="data/pins.json" as="fetch" crossorigin />

    <script
      src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"
      defer
    ></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#pin-list">Skip to list of pins</a>

    <header class="topbar">
      <form id="search-form" class="search" role="search" autocomplete="off">
        <label for="search" class="sr-only"
          >Search pins by name, place or tag</label
        >
        <input
          id="search"
          type="search"
          placeholder="Search pins"
          spellcheck="false"
          enterkeyhint="search"
        />
        <output id="count" class="count" for="search" aria-live="polite"
          >0 of 0</output
        >
        <button type="button" id="clear" class="btn btn-ghost" disabled>
          Clear
        </button>
      </form>
      <div
        id="chips"
        class="chips"
        role="group"
        aria-label="Filter by tag"
        hidden
      ></div>
    </header>

    <div id="map" role="region" aria-label="World map of pins"></div>

    <p id="status" class="status" role="status" hidden></p>

    <section
      id="pin-list"
      class="pin-list"
      aria-labelledby="pin-list-title"
      tabindex="-1"
    >
      <h2 id="pin-list-title" class="pin-list-title">All pins</h2>
      <ul id="pin-list-items" class="pin-list-items"></ul>
    </section>

    <aside
      id="panel"
      class="panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="panel-name"
      aria-hidden="true"
      tabindex="-1"
      inert
    >
      <div id="panel-handle" class="panel-handle" aria-hidden="true">
        <span></span>
      </div>
      <button
        type="button"
        id="panel-close"
        class="panel-close"
        aria-label="Close"
      >
        <svg
          viewBox="0 0 24 24"
          width="20"
          height="20"
          aria-hidden="true"
          focusable="false"
        >
          <path
            d="M6 6l12 12M18 6L6 18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </button>
      <div id="panel-body" class="panel-body">
        <figure id="panel-media" class="panel-media">
          <img
            id="panel-image"
            alt=""
            width="800"
            height="450"
            loading="lazy"
            decoding="async"
          />
        </figure>
        <p id="panel-eyebrow" class="eyebrow"></p>
        <h2 id="panel-name" class="panel-name"></h2>
        <p id="panel-summary" class="panel-summary"></p>
        <p class="panel-actions">
          <a
            id="panel-article"
            class="btn"
            target="_blank"
            rel="noopener"
            hidden
            >Read the full story</a
          >
        </p>
        <div id="panel-reel" class="reel" hidden></div>
      </div>
    </aside>

    <noscript><p class="status">This map needs JavaScript to run.</p></noscript>
  </body>
</html>
