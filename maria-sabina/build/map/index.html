<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HO01 map, shots 02-04</title>
<link rel="stylesheet" href="/vendor/maplibre-gl.css">
<style>
  @font-face { font-family: "JetBrains Mono"; src: url("/fonts/JetBrainsMono-VF.ttf") format("truetype"); font-weight: 100 800; }
  html, body { margin: 0; background: #07080C; overflow: hidden; }
  /* Design canvas is 1080 x 1920 CSS px; the exporter captures it at 2x for 2160 x 3840.
     No grain, no vignette here: those are added in post so they sit over the labels. */
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #07080C; }
  #map { position: absolute; inset: 0; background: #07080C; }
  #overlay { position: absolute; inset: 0; pointer-events: none; font-family: "JetBrains Mono", ui-monospace, monospace; }
  .lbl { position: absolute; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.18em; font-weight: 500;
         color: #FAF7F2; opacity: 0; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
  .lbl.city { font-size: calc(11px * var(--s)); }
  .lbl.region { font-size: calc(9px * var(--s)); opacity: 0; }
  .core { position: absolute; width: calc(4px * var(--s)); height: calc(4px * var(--s)); border-radius: 50%; background: #7C3AED;
          transform: translate(-50%, -50%); box-shadow: 0 0 calc(6px * var(--s)) rgba(124,58,237,0.9); opacity: 0; }
  .ring { position: absolute; width: calc(4px * var(--s)); height: calc(4px * var(--s)); border-radius: 50%;
          border: calc(1px * var(--s)) solid #FAF7F2; box-sizing: content-box; transform: translate(-50%, -50%); opacity: 0; }
  .tip  { position: absolute; width: calc(5px * var(--s)); height: calc(5px * var(--s)); border-radius: 50%; background: #FAF7F2;
          transform: translate(-50%, -50%); box-shadow: 0 0 calc(10px * var(--s)) rgba(124,58,237,1), 0 0 calc(3px * var(--s)) #7C3AED; opacity: 0; }
  .connector { position: absolute; height: 1px; background: rgba(250,247,242,0.4); transform-origin: 0 50%; transform: rotate(-45deg); opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="map"></div>
  <div id="overlay"></div>
</div>
<script src="/vendor/maplibre-gl.js"></script>
<script src="/map.js"></script>
</body>
</html>
